name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install ".[test]"

      # -X faulthandler: a crash in native code prints every thread's traceback.
      - name: Run tests
        run: python -X faulthandler -m coverage run -m unittest discover -s tests

      - name: Python statement and branch coverage
        run: python -m coverage report

      - name: Import smoke test
        run: python -c "import tachyaudio as ta; assert ta.get_backend().name == 'miniaudio'; print(len(ta.list_devices()))"

  macos:
    name: macOS Python ${{ matrix.python-version }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install ".[test]"

      - name: Run tests
        run: python -X faulthandler -m coverage run -m unittest discover -s tests

      - name: Python statement and branch coverage
        run: python -m coverage report

      - name: Import smoke test
        run: python -c "import tachyaudio as ta; print(ta.get_backend().name); print(len(ta.list_devices()))"

  windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install ".[test]"

      - name: Run tests
        run: python -X faulthandler -m coverage run -m unittest discover -s tests

      - name: Python statement and branch coverage
        run: python -m coverage report

      - name: Import smoke test
        run: python -c "import tachyaudio as ta; assert ta.get_backend().name == 'miniaudio'; print(len(ta.list_devices()))"
