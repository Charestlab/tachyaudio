[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tachyaudio"
version = "1.1.0"
description = "Low-level audio primitives for tachypy and Python experiments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "tachyaudio contributors" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.scripts]
tachyaudio-audio-report = "tachyaudio.audio_report:main"

[project.optional-dependencies]
test = ["coverage[toml]>=7.10", "numpy>=1.21"]
report = [
  "numpy>=1.21",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "ruff>=0.5",
  "numpy>=1.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tachyaudio = ["py.typed", "vendor/*.h", "vendor/*.LICENSE", "vendor/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tachyaudio"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux_*", "*-win32"]
test-command = "python -m unittest discover -s {project}/tests"
test-requires = ["numpy>=1.21"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.coverage.run]
branch = true
source = ["tachyaudio"]

[tool.coverage.report]
fail_under = 90
show_missing = true
